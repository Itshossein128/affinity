version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/affinity_dev_2026
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p affinity_dev_2026 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
